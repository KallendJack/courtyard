name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
      # A failed browser test's trace and page snapshot, so a flake on CI can be diagnosed (#163).
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          # Only the tests' own folders, never the throwaway worker folders beside them.
          path: |
            test-results/
            !test-results/e2e/
            !test-results/e2e-fresh-start/
          retention-days: 14
