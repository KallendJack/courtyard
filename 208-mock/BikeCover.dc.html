<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mountain biking Home, cover screen: the bike with its parts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Figtree,system-ui,sans-serif;color:#fff}
a{color:#b994ff}a:hover{color:#9d6bff}
.pill{height:30px;padding:0 11px;border-radius:99px;background:#161616;display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:#ddd;flex-shrink:0}
.count{font-size:11px;color:#8c8c8c}
.chip{height:26px;padding:0 10px;border-radius:99px;background:#161616;display:flex;align-items:center;font-size:12px;font-weight:600;color:#bbb;flex-shrink:0}
.chip.on{background:#9d6bff;color:#fff}
.next{height:32px;padding:0 12px;border-radius:99px;background:#111;border:1px solid #2a2a2a;display:flex;align-items:center;font-size:13px;font-weight:600;color:#ddd;flex-shrink:0}
.leg{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:10px;font-size:14px;line-height:18px}
.num{width:20px;height:20px;border-radius:99px;background:#9d6bff;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.flag{font-size:12px;color:#ffb21e;font-weight:600}
</style>
</helmet>
<div style="width: 400px; height: 900px; background: #070707; display: flex; flex-direction: column; box-sizing: border-box">
  <nav aria-label="Workspaces" style="display: flex; gap: 8px; padding: 14px 12px 10px; align-items: center; overflow: hidden">
    <div style="width: 44px; height: 44px; border-radius: 14px; background: #161616; flex-shrink: 0"></div>
    <div style="height: 44px; padding: 0 14px; border-radius: 16px; background: #111; display: flex; align-items: center; font-size: 14px; color: #bbb; flex-shrink: 0">Garage</div>
    <div style="height: 44px; padding: 0 14px; border-radius: 16px; background: #1c1c1c; box-shadow: 0 0 0 2px #9d6bff; display: flex; align-items: center; font-size: 14px; font-weight: 600; flex-shrink: 0">Mountain biking</div>
    <div style="height: 44px; padding: 0 14px; border-radius: 16px; background: #111; display: flex; align-items: center; font-size: 14px; color: #bbb; flex-shrink: 0">Courtyard</div>
  </nav>
  <main style="flex: 1; min-height: 0; background: #000; border-radius: 18px 18px 0 0; border: 1px solid #1a1a1a; border-bottom: 0; display: flex; flex-direction: column; padding: 16px 14px 10px; gap: 12px; box-sizing: border-box">
    <header style="display: flex; justify-content: space-between; align-items: flex-start">
      <div style="display: flex; flex-direction: column; gap: 10px; min-width: 0">
        <h1 style="margin: 0; font-size: 26px; line-height: 31px; font-weight: 800">Mountain biking</h1>
        <div style="display: flex; gap: 6px">
          <span class="pill">+ New</span>
          <span class="pill">History <span class="count">12</span></span>
          <span class="pill">Things <span class="count">9</span></span>
          <span class="pill">Docs <span class="count">3</span></span>
        </div>
      </div>
      <div role="img" aria-label="The bike's photo" style="width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(135deg, #3a3326, #1d2a22); border: 1px solid #2a2a2a; flex-shrink: 0"></div>
    </header>
    <div style="align-self: flex-end; max-width: 80%; background: #1a1a1a; border-radius: 14px 14px 4px 14px; padding: 8px 14px; font-size: 15px; line-height: 21px">Is the bike ready for Saturday?</div>
    <section aria-label="Current view: the bike" style="flex: 1; min-height: 0; background: #0b0b0b; border: 1px solid #1f1f1f; border-radius: 18px; padding: 10px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; gap: 6px"><span class="chip on">The bike</span><span class="chip">Wanted · 3</span><span class="chip">Saturday</span></div>
      <div role="img" aria-label="Photo of the bike with numbered pins on its parts" style="height: 230px; position: relative; border-radius: 14px; background: radial-gradient(ellipse at 50% 60%, #2b2a24 0%, #141412 70%); overflow: hidden; flex-shrink: 0">
        <svg aria-hidden="true" viewBox="0 0 400 260" style="position: absolute; inset: 0; width: 100%; height: 100%" fill="none" stroke="#6b6658" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="100" cy="175" r="58"/><circle cx="300" cy="175" r="58"/><path d="M100 175 175 100h95l30 75M175 100l25 75h-100M200 175l70-75M262 82h28M175 100l-12-24h-22"/></svg>
        <span class="num" style="position: absolute; left: 47%; top: 66%">1</span>
        <span class="num" style="position: absolute; left: 20%; top: 40%">2</span>
        <span class="num" style="position: absolute; left: 67%; top: 27%">3</span>
        <span class="num" style="position: absolute; left: 82%; top: 62%">4</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div class="leg" style="background: #161616"><span class="num">1</span><div style="flex: 1">Chain</div><span class="flag">replace</span></div>
        <div class="leg"><span class="num">2</span><div style="flex: 1">Rear tyre</div><span class="flag">25 psi</span></div>
        <div class="leg"><span class="num">3</span><div style="flex: 1">Lights</div><span style="font-size: 12px; color: #8c8c8c">to get</span></div>
        <div class="leg"><span class="num">4</span><div style="flex: 1">Fork</div><span style="font-size: 12px; color: #a9bc85">fine</span></div>
      </div>
    </section>
    <div style="display: flex; gap: 8px; overflow: hidden"><span class="next">Find a chain under £30</span><span class="next">Which lights?</span></div>
  </main>
  <footer style="background: #070707; padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; gap: 10px">
      <button style="flex: 1; height: 46px; border-radius: 12px; border: 0; background: #161616; color: #ddd; font: 700 13px Figtree, sans-serif">Skills</button>
      <button style="flex: 1; height: 46px; border-radius: 12px; border: 0; background: #161616; color: #ddd; font: 700 13px Figtree, sans-serif">Sonnet</button>
    </div>
    <div style="display: flex; gap: 10px">
      <button aria-label="Type" style="width: 62px; height: 62px; border-radius: 16px; border: 1px solid #1f1f1f; background: #0b0b0b; color: #8c8c8c; font: 700 10px Figtree, sans-serif">TYPE</button>
      <button style="flex: 1; height: 62px; border-radius: 16px; border: 1px solid #3b2b66; background: #0b0b0b; color: #fff; text-align: left; padding: 0 16px; font-family: Figtree, sans-serif">
        <div style="font-size: 17px; font-weight: 700">Tap or hold to talk</div>
        <div style="font-size: 13px; color: #8c8c8c">Mountain biking</div>
      </button>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
