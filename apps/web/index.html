<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- resizes-content: the page shrinks when the on-screen keyboard opens, so the message box stays above it.
         cover: the page draws behind a phone's gesture bar, so that strip is its own colour (#157). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content, viewport-fit=cover" />
    <!-- Pictures come only from Courtyard itself: nothing in an answer or a diagram can load one from elsewhere (ADR 0021). -->
    <meta http-equiv="Content-Security-Policy" content="img-src 'self' blob: data:" />
    <title>Courtyard</title>
    <meta name="theme-color" content="#F3F0EC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070707" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
